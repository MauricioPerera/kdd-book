<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kdd-book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%2300d4a4%22/></svg>">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    var known = ['es', 'en', 'pt'];
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (known.indexOf(lang) === -1) lang = 'en';
    window.location.replace('./' + lang + '/');
  })();
</script>
</head>
<body>
  <header class="hero" style="min-height: 100vh; display:flex; align-items:center;">
    <div class="wrap" style="width:100%;">

      <h1>Choose your language / Elegí tu idioma / Escolha seu idioma</h1>
      <div class="cta-row">
        <a class="button-primary button-accent" href="./es/">Español</a>
        <a class="button-primary button-accent" href="./en/">English</a>
        <a class="button-primary button-accent" href="./pt/">Português</a>
      </div>
    </div>
  </header>
</body>
</html>
